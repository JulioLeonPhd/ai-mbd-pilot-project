<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 226"
     role="img" aria-labelledby="title description">
  <title id="title">From system architecture to one component at a time</title>
  <desc id="description">Grill the system design. The engineer approves the
    architecture, including component boundaries. For each component, grill the
    design and get human approval.
    AI builds the implementation and writes a runnable walkthrough in parallel.
    The engineer reviews and approves both before closing via pull request.</desc>
  <style>
    text { font: 14px system-ui, sans-serif; fill: var(--text); }
    .label { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: var(--accent); }
    .muted { fill: var(--muted); }
    .strong { font-weight: 650; }
    .box { fill: var(--canvas); stroke: var(--border); }
    .panel { fill: var(--panel); stroke: var(--accent); }
    .selected { fill: var(--highlight); stroke: var(--accent); }
  </style>
  <g style="--canvas:#fff;--panel:#f6f8fa;--highlight:#ddf4ff;--border:#d1d9e0;
            --text:#1f2328;--muted:#59636e;--accent:#0969da">
    <rect width="412" height="226" rx="8" fill="var(--canvas)"/>
    <text class="label" x="12" y="20">SYSTEM ARCHITECTURE</text>
    <text x="12" y="40">Grill the design · Engineer approves architecture</text>
    <rect class="box" x="12.5" y="52.5" width="123" height="27" rx="5"/>
    <rect class="selected" x="144.5" y="52.5" width="123" height="27" rx="5"/>
    <rect class="box" x="276.5" y="52.5" width="123" height="27" rx="5"/>
    <g text-anchor="middle">
      <text class="muted" x="74" y="71">Component A</text>
      <text class="strong" x="206" y="71">Component B</text>
      <text class="muted" x="338" y="71">Component C</text>
    </g>
    <path d="M206 80v14" fill="none" stroke="var(--accent)"/>
    <rect class="panel" x="12.5" y="94.5" width="387" height="123" rx="7"/>
    <text class="label" x="24" y="114">REPEAT FOR EACH COMPONENT</text>
    <text x="24" y="134">Grill the design · Engineer approves approach</text>
    <text class="label" x="24" y="154">AI WORK IN PARALLEL</text>
    <rect class="box" x="24.5" y="161.5" width="175" height="26" rx="5"/>
    <rect class="box" x="212.5" y="161.5" width="175" height="26" rx="5"/>
    <g class="strong" text-anchor="middle">
      <text x="112" y="179">Implementation</text>
      <text x="300" y="179">Runnable walkthrough</text>
    </g>
    <text x="24" y="205">Engineer reviews and approves both · Close via PR</text>
  </g>
</svg>
