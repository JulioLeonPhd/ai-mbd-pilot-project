<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1562px;height:954px;background:#FFFFFF;" width="1562px" height="954px" viewBox="0 0 1562 954" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="522.325" y="23.132" fill="#000" font-size="14" textLength="510.351" font-weight="700" font-family="Arial">Radar V1 batch data shapes, implementation stage, and execution questions</text></g><!--cluster Illustrative batch data organization; DDC behavior evidenced separately--><g class="cluster" data-qualified-name="Illustrative batch data organization. DDC behavior evidenced separately" id="ent0001" data-source-line="15"><rect x="7" y="44.099" width="493" height="682.62" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="14.656" y="59.23" fill="#000" font-size="14" textLength="477.688" font-weight="700" font-family="Arial">Illustrative batch data organization; DDC behavior evidenced separately</text></g><!--cluster Future Simulink representations: fixed dimensions per configured model--><g class="cluster" data-qualified-name="Future Simulink representations. fixed dimensions per configured model" id="ent0011" data-source-line="27"><rect x="1048" y="44.099" width="500" height="438.13" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="1055.683" y="59.23" fill="#000" font-size="14" textLength="484.634" font-weight="700" font-family="Arial">Future Simulink representations: fixed dimensions per configured model</text></g><!--entity D--><g class="entity" data-qualified-name="Illustrative batch data organization. DDC behavior evidenced separately.D" id="ent0002" data-source-line="16"><rect x="278.72" y="79.099" width="200.564" height="68.296" fill="#B7E1CD" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="288.72" y="102.23" fill="#000" font-size="14" textLength="61.469" font-family="Arial">DDC data</text><text x="288.72" y="118.329" fill="#000" font-size="14" textLength="93.372" font-family="Arial">[N,64] complex</text><text x="288.72" y="134.428" fill="#000" font-size="14" textLength="180.564" font-family="Arial">12.5 MS/s/channel candidate</text></g><!--entity B--><g class="entity" data-qualified-name="Illustrative batch data organization. DDC behavior evidenced separately.B" id="ent0003" data-source-line="17"><rect x="247.23" y="254.609" width="235.544" height="52.197" fill="#B7E1CD" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="257.23" y="277.74" fill="#000" font-size="14" textLength="215.544" font-family="Arial">Commanded azimuth beamformed</text><text x="257.23" y="293.839" fill="#000" font-size="14" textLength="199.192" font-family="Arial">[N,4] complex elevation streams</text></g><!--entity R--><g class="entity" data-qualified-name="Illustrative batch data organization. DDC behavior evidenced separately.R" id="ent0004" data-source-line="18"><rect x="274.45" y="414.029" width="181.109" height="52.197" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="284.45" y="437.16" fill="#000" font-size="14" textLength="112.848" font-family="Arial">Range processing</text><text x="284.45" y="453.259" fill="#000" font-size="14" textLength="161.109" font-family="Arial">[rangeBin,pulse,elevation]</text></g><!--entity ACC--><g class="entity" data-qualified-name="Illustrative batch data organization. DDC behavior evidenced separately.ACC" id="ent0005" data-source-line="19"><rect x="226.71" y="529.229" width="256.571" height="68.296" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="236.71" y="552.36" fill="#000" font-size="14" textLength="235.402" font-family="Arial">Pulse accumulation + range-migration</text><text x="236.71" y="568.459" fill="#000" font-size="14" textLength="236.571" font-family="Arial">handling; prepare slow-time ensemble</text><text x="236.71" y="584.558" fill="#000" font-size="14" textLength="181.316" font-family="Arial">initially without compensation</text></g><!--entity V--><g class="entity" data-qualified-name="Illustrative batch data organization. DDC behavior evidenced separately.V" id="ent0006" data-source-line="20"><rect x="247.71" y="658.529" width="214.578" height="52.197" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="257.71" y="681.66" fill="#000" font-size="14" textLength="80.165" font-family="Arial">Doppler data</text><text x="257.71" y="697.759" fill="#000" font-size="14" textLength="194.578" font-family="Arial">[rangeBin,dopplerBin,elevation]</text></g><!--entity BEHAV--><g class="entity" data-qualified-name="Future Simulink representations. fixed dimensions per configured model.BEHAV" id="ent0012" data-source-line="28"><rect x="1064.06" y="79.099" width="223.889" height="68.296" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1074.06" y="102.23" fill="#000" font-size="14" textLength="134.613" font-family="Arial">Behavioral model first</text><text x="1074.06" y="118.329" fill="#000" font-size="14" textLength="203.103" font-family="Arial">approved algorithms / interfaces;</text><text x="1074.06" y="134.428" fill="#000" font-size="14" textLength="203.889" font-family="Arial">not required to be cycle-accurate</text></g><!--entity HW--><g class="entity" data-qualified-name="Future Simulink representations. fixed dimensions per configured model.HW" id="ent0013" data-source-line="29"><rect x="1065.29" y="254.609" width="169.42" height="52.197" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1075.29" y="277.74" fill="#000" font-size="14" textLength="149.42" font-family="Arial">Later hardware-oriented</text><text x="1075.29" y="293.839" fill="#000" font-size="14" textLength="136.958" font-family="Arial">implementation model</text></g><!--entity HDL--><g class="entity" data-qualified-name="Future Simulink representations. fixed dimensions per configured model.HDL" id="ent0014" data-source-line="30"><rect x="1067.97" y="414.029" width="118.062" height="52.197" fill="#F4CCCC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1077.97" y="437.16" fill="#000" font-size="14" textLength="98.062" font-family="Arial">HDL generation</text><text x="1077.97" y="453.259" fill="#000" font-size="14" textLength="52.145" font-family="Arial">deferred</text></g><!--entity OPEN--><g class="entity" data-qualified-name="OPEN" id="ent0017" data-source-line="35"><rect x="7.61" y="788.719" width="276.785" height="68.296" fill="#F4CCCC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17.61" y="811.85" fill="#000" font-size="14" textLength="196.868" font-family="Arial">Rates, sample/frame execution,</text><text x="17.61" y="827.949" fill="#000" font-size="14" textLength="256.785" font-family="Arial">buffer owner, corner-turn implementation,</text><text x="17.61" y="844.048" fill="#000" font-size="14" textLength="208.571" font-family="Arial">latency, and execution granularity</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="39"><path d="M517.47,223.389 L517.47,338.03 A0,0 0 0 0 517.47,338.03 L1030.528,338.03 A0,0 0 0 0 1030.528,338.03 L1030.528,233.389 L1020.528,223.389 L642.56,223.389 L458.93,147.729 L634.56,223.389 L517.47,223.389 A0,0 0 0 0 517.47,223.389" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1020.528,223.389 L1020.528,233.389 L1030.528,233.389 L1020.528,223.389" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="523.47" y="240.582" fill="#000" font-size="13" textLength="444.368" font-family="Arial">Historical DDC-002 evidence: 372 ADC-tick group delay (31 output samples);</text><text x="523.47" y="255.531" fill="#000" font-size="13" textLength="422.729" font-family="Arial">continuous state across PRI/transition boundaries. Current approved API:</text><text x="523.47" y="270.48" fill="#000" font-size="13" textLength="397.414" font-family="Arial">one complete physical PRI per call, fresh local state. Scoped per-PRI</text><text x="523.47" y="285.429" fill="#000" font-size="13" textLength="455.235" font-family="Arial">unit/fixture and full-scan DDC observations passed. No end-to-end or hardware</text><text x="523.47" y="300.377" fill="#000" font-size="13" textLength="492.058" font-family="Arial">claim. See CURRENT.md for pinned DDC-002 replay and independent-review status.</text><text x="523.47" y="315.326" fill="#000" font-size="13" textLength="445.117" font-family="Arial">Simulink dimensions are fixed per configured model; execution details remain</text><text x="523.47" y="330.275" fill="#000" font-size="13" textLength="67.209" font-family="Arial">unresolved.</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="49"><path d="M518.15,535.959 L518.15,590.805 A0,0 0 0 0 518.15,590.805 L995.858,590.805 A0,0 0 0 0 995.858,590.805 L995.858,545.959 L985.858,535.959 L674.04,535.959 L447.65,466.699 L666.04,535.959 L518.15,535.959 A0,0 0 0 0 518.15,535.959" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M985.858,535.959 L985.858,545.959 L995.858,545.959 L985.858,535.959" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="524.15" y="553.152" fill="#000" font-size="13" textLength="456.708" font-family="Arial">These tensors show batch data organization only, not settled streaming module</text><text x="524.15" y="568.101" fill="#000" font-size="13" textLength="428.505" font-family="Arial">interfaces. The pulse axis represents per-pulse range results; the separate</text><text x="524.15" y="583.05" fill="#000" font-size="13" textLength="354.053" font-family="Arial">accumulation responsibility prepares the slow-time ensemble.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="55"><path d="M319.36,795.449 L319.36,850.295 L808.646,850.295 L808.646,805.449 L798.646,795.449 L319.36,795.449" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M798.646,795.449 L798.646,805.449 L808.646,805.449 L798.646,795.449" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="325.36" y="812.642" fill="#000" font-size="13" textLength="435.037" font-family="Arial">Accepted timing evidence: five PRFs; usable pulse counts [22,25,28,32,35];</text><text x="325.36" y="827.591" fill="#000" font-size="13" textLength="436.49" font-family="Arial">151 schedule records; 10,553,388 ADC ticks under the 10,597,950-tick cap.</text><text x="325.36" y="842.54" fill="#000" font-size="13" textLength="468.286" font-family="Arial">This schedule evidence does not demonstrate end-to-end detection performance.</text></g><!--link D to B--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="21" data-link-type="dependency"><path d="M376.17,147.729 C373.51,179.179 370.002,220.566 367.582,249.146" style="stroke:#181818;stroke-width:1;" fill="none" id="D-to-B"/><polygon points="367.16,254.129,371.905,245.498,367.582,249.146,363.934,244.823,367.16,254.129" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B to R--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="22" data-link-type="dependency"><path d="M365,307.009 C365,336.289 365,379.269 365,408.639" style="stroke:#181818;stroke-width:1;" fill="none" id="B-to-R"/><polygon points="365,413.639,369,404.639,365,408.639,361,404.639,365,413.639" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link R to ACC--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="23" data-link-type="dependency"><path d="M362.9,466.549 C361.4,484.739 359.781,504.426 358.151,524.176" style="stroke:#181818;stroke-width:1;" fill="none" id="R-to-ACC"/><polygon points="357.74,529.159,362.467,520.518,358.151,524.176,354.494,519.86,357.74,529.159" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ACC to V--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk10" data-source-line="24" data-link-type="dependency"><path d="M355,597.909 C355,617.059 355,635.689 355,653.279" style="stroke:#181818;stroke-width:1;" fill="none" id="ACC-to-V"/><polygon points="355,658.279,359,649.279,355,653.279,351,649.279,355,658.279" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link BEHAV to HW--><g class="link" data-entity-1="ent0012" data-entity-2="ent0013" id="lnk15" data-source-line="31" data-link-type="dependency"><path d="M1170.74,147.729 C1165.8,179.179 1159.286,220.609 1154.796,249.189" style="stroke:#181818;stroke-width:1;" fill="none" id="BEHAV-to-HW"/><polygon points="1154.02,254.129,1159.368,245.858,1154.796,249.189,1151.465,244.617,1154.02,254.129" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1166.33" y="190.582" fill="#000" font-size="13" textLength="61.407" font-family="Arial">may follow</text></g><!--link HW to HDL--><g class="link" data-entity-1="ent0013" data-entity-2="ent0014" id="lnk16" data-source-line="32" data-link-type="dependency"><path d="M1146.3,307.009 C1142.03,336.289 1135.744,379.321 1131.444,408.691" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="HW-to-HDL"/><polygon points="1130.72,413.639,1135.982,405.313,1131.444,408.691,1128.066,404.154,1130.72,413.639" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1138.12" y="381.222" fill="#000" font-size="13" textLength="159.701" font-family="Arial">future; no readiness implied</