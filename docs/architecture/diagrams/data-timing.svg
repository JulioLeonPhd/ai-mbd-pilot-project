font-size="14" textLength="236.571" font-family="Arial">handling; prepare slow-time ensemble</text><text x="236.1" y="539.718" fill="#000" font-size="14" textLength="181.316" font-family="Arial">initially without compensation</text></g><!--entity V--><g class="entity" data-qualified-name="Illustrative batch data organization. DDC behavior evidenced separately.V" id="ent0006" data-source-line="20"><rect x="247.1" y="613.689" width="214.578" height="52.197" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="257.1" y="636.82" fill="#000" font-size="14" textLength="80.165" font-family="Arial">Doppler data</text><text x="257.1" y="652.919" fill="#000" font-size="14" textLength="194.578" font-family="Arial">[rangeBin,dopplerBin,elevation]</text></g><!--entity BEHAV--><g class="entity" data-qualified-name="Future Simulink representations. fixed dimensions per configured model.BEHAV" id="ent0012" data-source-line="28"><rect x="1025.45" y="79.099" width="223.889" height="68.296" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1035.45" y="102.23" fill="#000" font-size="14" textLength="134.613" font-family="Arial">Behavioral model first</text><text x="1035.45" y="118.329" fill="#000" font-size="14" textLength="203.103" font-family="Arial">approved algorithms / interfaces;</text><text x="1035.45" y="134.428" fill="#000" font-size="14" textLength="203.889" font-family="Arial">not required to be cycle-accurate</text></g><!--entity HW--><g class="entity" data-qualified-name="Future Simulink representations. fixed dimensions per configured model.HW" id="ent0013" data-source-line="29"><rect x="1026.68" y="232.199" width="169.42" height="52.197" fill="#FFF2CC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1036.68" y="255.33" fill="#000" font-size="14" textLength="149.42" font-family="Arial">Later hardware-oriented</text><text x="1036.68" y="271.429" fill="#000" font-size="14" textLength="136.958" font-family="Arial">implementation model</text></g><!--entity HDL--><g class="entity" data-qualified-name="Future Simulink representations. fixed dimensions per configured model.HDL" id="ent0014" data-source-line="30"><rect x="1029.36" y="369.189" width="118.062" height="52.197" fill="#F4CCCC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1039.36" y="392.32" fill="#000" font-size="14" textLength="98.062" font-family="Arial">HDL generation</text><text x="1039.36" y="408.419" fill="#000" font-size="14" textLength="52.145" font-family="Arial">deferred</text></g><!--entity OPEN--><g class="entity" data-qualified-name="OPEN" id="ent0017" data-source-line="35"><rect x="7" y="743.879" width="276.785" height="68.296" fill="#F4CCCC" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="767.01" fill="#000" font-size="14" textLength="196.868" font-family="Arial">Rates, sample/frame execution,</text><text x="17" y="783.109" fill="#000" font-size="14" textLength="256.785" font-family="Arial">buffer owner, corner-turn implementation,</text><text x="17" y="799.208" fill="#000" font-size="14" textLength="208.571" font-family="Arial">latency, and execution granularity</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="39"><path d="M517,223.399 L517,293.194 A0,0 0 0 0 517,293.194 L991.781,293.194 A0,0 0 0 0 991.781,293.194 L991.781,233.399 L981.781,223.399 L668.18,223.399 L466.55,147.789 L660.18,223.399 L517,223.399 A0,0 0 0 0 517,223.399" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M981.781,223.399 L981.781,233.399 L991.781,233.399 L981.781,223.399" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="523" y="240.592" fill="#000" font-size="13" textLength="415.505" font-family="Arial">DDC bounded evidence: 372 ADC-tick group delay (31 output samples);</text><text x="523" y="255.541" fill="#000" font-size="13" textLength="427.045" font-family="Arial">state retained across PRI/transition boundaries. MATLAB accepts variable</text><text x="523" y="270.49" fill="#000" font-size="13" textLength="453.781" font-family="Arial">frame lengths while preserving continuous state; Simulink dimensions are fixed</text><text x="523" y="285.439" fill="#000" font-size="13" textLength="390.92" font-family="Arial">per configured model and do not allow runtime-variable frame sizes.</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="46"><path d="M517.54,491.119 L517.54,545.965 A0,0 0 0 0 517.54,545.965 L995.248,545.965 A0,0 0 0 0 995.248,545.965 L995.248,501.119 L985.248,491.119 L673.43,491.119 L447.04,421.859 L665.43,491.119 L517.54,491.119 A0,0 0 0 0 517.54,491.119" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M985.248,491.119 L985.248,501.119 L995.248,501.119 L985.248,491.119" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="523.54" y="508.312" fill="#000" font-size="13" textLength="456.708" font-family="Arial">These tensors show batch data organization only, not settled streaming module</text><text x="523.54" y="523.261" fill="#000" font-size="13" textLength="428.505" font-family="Arial">interfaces. The pulse axis represents per-pulse range results; the separate</text><text x="523.54" y="538.21" fill="#000" font-size="13" textLength="354.053" font-family="Arial">accumulation responsibility prepares the slow-time ensemble.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="52"><path d="M318.75,750.609 L318.75,805.455 L808.036,805.455 L808.036,760.609 L798.036,750.609 L318.75,750.609" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M798.036,750.609 L798.036,760.609 L808.036,760.609 L798.036,750.609" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="324.75" y="767.802" fill="#000" font-size="13" textLength="435.037" font-family="Arial">Accepted timing evidence: five PRFs; usable pulse counts [22,25,28,32,35];</text><text x="324.75" y="782.751" fill="#000" font-size="13" textLength="436.49" font-family="Arial">151 schedule records; 10,553,388 ADC ticks under the 10,597,950-tick cap.</text><text x="324.75" y="797.7" fill="#000" font-size="13" textLength="468.286" font-family="Arial">This schedule evidence does not demonstrate end-to-end detection performance.</text></g><!--link D to B--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="21" data-link-type="dependency"><path d="M375.11,147.789 C372.59,173.549 369.648,203.603 367.348,227.043" style="stroke:#181818;stroke-width:1;" fill="none" id="D-to-B"/><polygon points="366.86,232.019,371.72,223.452,367.348,227.043,363.758,222.671,366.86,232.019" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link B to R--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-source-line="22" data-link-type="dependency"><path d="M364.39,284.689 C364.39,308.819 364.39,339.919 364.39,364.009" style="stroke:#181818;stroke-width:1;" fill="none" id="B-to-R"/><polygon points="364.39,369.009,368.39,360.009,364.39,364.009,360.39,360.009,364.39,369.009" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link R to ACC--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-source-line="23" data-link-type="dependency"><path d="M362.29,421.709 C360.79,439.899 359.171,459.586 357.541,479.336" style="stroke:#181818;stroke-width:1;" fill="none" id="R-to-ACC"/><polygon points="357.13,484.319,361.857,475.678,357.541,479.336,353.884,475.02,357.13,484.319" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ACC to V--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk10" data-source-line="24" data-link-type="dependency"><path d="M354.39,553.069 C354.39,572.219 354.39,590.849 35