[project]
name = "ai-mbd-pilot-project"
version = "0.6.0"
description = "AI-assisted model-based design pilot project"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "git-changelog>=2.9.7,<3",
    "pyright>=1.1.414",
    "ruff>=0.13,<1",
]

[tool.uv]
# This repository is not a Python package; uv manages the tooling environment.
package = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.git-changelog]
bump = "auto"
convention = "basic"
include-all = true
in-place = true
marker-line = "<!-- insertion marker -->"
output = "CHANGELOG.md"
parse-trailers = true
sections = ["add", "change", "fix", "remove", "merge", "doc"]
template = "keepachangelog"
versioning = "semver"
zerover = true
